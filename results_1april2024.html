        var downloadFile = function (data, type, fileName) {

            let file;

            if (!fileName) {
                return data;
            }

            if (data instanceof Blob) {
                file = data;
            }
            else {
                file = new Blob([data], { type: type });
            }

            if (window.navigator.msSaveOrOpenBlob) { // Edge
                window.navigator.msSaveOrOpenBlob(file, fileName);
            }
            else { // Chrome, Firefox, Safari
                const a = document.createElement('a'),
                    url = URL.createObjectURL(file);

                a.href = url;
                a.download = fileName;
                a.style.position = 'absolute';
                a.style.visibility = 'hidden';

                document.body.appendChild(a);

                a.click();

                setTimeout(function () {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 0);
            }
        };

                    { text: '', datafield: 'cid', width: 200, cellsrenderer: cellsrenderer_akosdbstructure, editable: false, exportable: false },

                    { text: 'AKos number', datafield: 'registryid', cellclassname: cellclass, width: 200 },

                    { text: 'Type', datafield: 'type', cellclassname: cellclass, width: 100 },

                    { text: 'Molname', datafield: 'molname', cellclassname: cellclass },

                    { text: 'CAS Number', datafield: 'casnumber', cellclassname: cellclass },

                    { text: 'Molformula', datafield: 'molformula', cellclassname: cellclass },

                    { text: 'Molweight', datafield: 'molweight', cellclassname: cellclass },

                    { text: 'Similarity', datafield: 'similarityvalue', cellclassname: cellclass },

                    //{ text: 'Fullmatch', datafield: 'bisidenticalwithquery', cellclassname: cellclass },

                    {
                        text: "",
                        datafield: "Add",
                        columntype: "custom",
                        width: 160,
                        exportable: false,
                        style: style,

                        
                        
                        cellsrenderer: function (row, columnfield, value, defaulthtml, columnproperties, rowdata) {

                            

                            var html = "<div style='width: 160px; height: 200px; margin: auto;text-align: center;display:table-cell;vertical-align: middle;'><center><input type='button' style='height: 40px; width: 100px;cursor: pointer' value='Add quantity' /></center></div>";


                            return html;


                        },
                        
                        buttonclick: function (row) {
                            


                            var data = $('#grid_relatedcids').jqxGrid('getrowdata', row);
                            $("#akosnumber").val(data.registryid);



                            

                            $('#quantity').jqxNumberInput('val', 0);


                            

                            var source = {
                                datatype: "json",
                                datafields: [
                                    { name: 'UnitUIlabel' },
                                    { name: 'UnitValue' }
                                ],
                                localdata: units,
                                async: true
                            };
                            var dataAdapter = new $.jqx.dataAdapter(source);
                            $("#units").jqxDropDownList({
                                selectedIndex: 1, source: dataAdapter, displayMember: "UnitUIlabel", valueMember: "UnitValue", width: 200, height: 30
                            });
                            


                            $('#additionalinformation').jqxTextArea('val', '');


                            $("#popupwindowshoppingcard").jqxWindow("move", $(window).width() / 2 - $("#popupwindowshoppingcard").jqxWindow("width") / 2, $(window).height() / 2 - $("#popupwindowshoppingcard").jqxWindow("height") / 2);

                            

                            $("#popupwindowshoppingcard").jqxWindow('open');


                        }
                    }
                ]
            });

            

            if (sessionStorage.getItem("griddata") != null) {

                

                var data = sessionStorage.getItem("griddata");


                

                var importdata = JSON.parse(data);

                var relatedcids_gridsource_dataFields = [

                    { name: 'strucutureimageurl', type: 'string' },

                    { name: 'cid', type: 'int' },

                    { name: 'registryid', type: 'string' },

                    { name: 'type', type: 'string' },

                    { name: 'bisidenticalwithquery', type: 'bool' },

                    { name: 'molname', type: 'string' },

                    { name: 'molformula', type: 'string' },

                    { name: 'molweight', type: 'number' },

                    { name: 'casnumber', type: 'string' },

                    { name: 'similarityvalue', type: 'number' },

                    
                ];


                var relatedcids_gridsource = {

                    datatype: "json",

                    datafields: relatedcids_gridsource_dataFields,




                    localdata: importdata


                };

                var relatedcids_griddataAdapter = new $.jqx.dataAdapter(relatedcids_gridsource);

                $("#grid_relatedcids").jqxGrid({ source: relatedcids_griddataAdapter });

                $('#grid_relatedcids').jqxGrid('updatebounddata');

                

                document.getElementById('numberofhits').innerText = "Number of hits " + importdata.length;


                

            }



            


            $("#grid_relatedcids").on("cellclick", function (event) {


                


                var args = event.args;
                // row's bound index.
                var rowBoundIndex = args.rowindex;
                // row's visible index.
                var rowVisibleIndex = args.visibleindex;
                // right click.
                var rightclick = args.rightclick;
                // original event.
                var ev = args.originalEvent;
                // column index.
                var columnindex = args.columnindex;
                // column data field.
                var dataField = args.datafield;


                $("#grid_relatedcids").jqxGrid('selectrow', rowBoundIndex);

                

                if (dataField == "cid") {

                    var datarow = $('#grid_relatedcids').jqxGrid('getrowdata', rowBoundIndex);
                    
                    var akosnumber = datarow.registryid

                    
                    jdata = {};

                    
                    jdata.akosnumber = akosnumber;

                    $('#jqxLoader').jqxLoader('open');
                    $.ajax({

                        type: "POST",
                        url: "http://akoscompounds.de/webinquiriesapibingodev/api/akoswebrequestsapi/GetMolfiledataforAkosnumber",
                        cache: false,
                        data: JSON.stringify(jdata),
                        success: function (response) {
                            $('#jqxLoader').jqxLoader('close');
                            if (response.errorflag) {
                                $('#messagenotification').jqxNotification({ template: 'error' });
                                $("#messagenotification").find("div").first().text("Error calling GetMolfiledataforAkosnumber. Message : " + response.errortext);
                                $("#messagenotification").jqxNotification("open");
                            } else {

                                var molfile = response.resultobject;


                                var ketcherFrame = document.getElementById('zoomketcherwindow_ketcher');

                                var ketcher = ketcherFrame.contentWindow.ketcher;

                                ketcher.setMolecule(molfile);

                                $("#zoomketcherwindow").jqxWindow('open');



                            }


                        },
                        error: function (error) {
                            $('#jqxLoader').jqxLoader('close');

                            $('#jqxLoader').jqxLoader('close');
                            $('#messagenotification').jqxNotification({ template: 'error' });
                            $("#messagenotification").find("div").first().text("Error calling GetMolfiledataforAkosnumber. Status : " + error.status);
                            $("#messagenotification").jqxNotification("open");


                        }




                    });



                } else {



                    if (dataField === "Add") {





                        var data = $('#grid_relatedcids').jqxGrid('getrowdata', rowBoundIndex);

                        $("#akosnumber").val(data.registryid);


                        $('#quantity').jqxNumberInput('val', 0);

                        var source = {
                            datatype: "json",
                            datafields: [
                                { name: 'UnitUIlabel' },
                                { name: 'UnitValue' }
                            ],
                            localdata: units,
                            async: true
                        };
                        var dataAdapter = new $.jqx.dataAdapter(source);
                        $("#units").jqxDropDownList({
                            selectedIndex: 1, source: dataAdapter, displayMember: "UnitUIlabel", valueMember: "UnitValue", width: 200, height: 30
                        });

                        $('#additionalinformation').jqxTextArea('val', '');

                        
                        $("#popupwindowshoppingcardform_casnumber").val(data.casnumber);

                        $("#popupwindowshoppingcardform_molname").val(data.molname);

                        $("#popupwindowshoppingcard").jqxWindow("move", $(window).width() / 2 - $("#popupwindowshoppingcard").jqxWindow("width") / 2, $(window).height() / 2 - $("#popupwindowshoppingcard").jqxWindow("height") / 2);


                        $("#popupwindowshoppingcard").jqxWindow('open');

                        

                    }
                    










                }


            });


            



        });

    </script>
