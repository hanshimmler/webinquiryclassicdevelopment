    <script>


        function closenotification(notificationid) {







            if ($('#' + notificationid).length > 0) {



                $('#' + notificationid).jqxNotification('closeAll');


            }



        }





        function isNotEmpty(value) {



            if (typeof value !== 'undefined') {



                if (value !== null) {


                    if (value) {



                        return true;


                    } else {




                        return false;


                    }



                } else {


                    return false;


                }






            } else {
                return false;
            }



        }






        function doName2Structurelookup(origin) {



            var n2sinput = $('#n2sinput').jqxInput('val');

            if (isNotEmpty(n2sinput)) {


                jdata = {};

                jdata.name = n2sinput;

                jdata.origin = origin;

                $('#jqxLoader').jqxLoader('open');
                $.ajax({
                    type: "POST",

                    url: "https://akoscompounds.de/webinquiriesapibingodev/api/akoswebrequestsapi/Name2Structure",
                    cache: false,
                    data: JSON.stringify(jdata),
                    success: function (response) {
                        $('#jqxLoader').jqxLoader('close');

                        if (response.errorflag) {

                            closenotification("messagenotification");


                            $('#messagenotification').jqxNotification({ autoClose: false, width: "auto", height: 50, template: 'error', appendContainer: "#Drawsearchpagenotificationcontainer" });        
                            $("#messagenotification").find("div").first().text("Error calling Name2Structure. Message : " + response.errortext);
                            $("#messagenotification").jqxNotification("open");
                        } else {

                            if (response.noCIDMatch) {


                                closenotification("messagenotification");

                                

                                sessionStorage.setItem("openquickrequest", "YES");
                                window.location.href = "https://akoscompounds.de/webinquiryappbingo/index.html";
                                

                                

                            } else {


                                var ketcherFrame = document.getElementById('ketcher');

                                var ketcher = ketcherFrame.contentWindow.ketcher;

                                ketcher.setMolecule(response.bestchoiceCIDMolfile);





                            }


                        }
                    },
                    error: function (error) {
                        $('#jqxLoader').jqxLoader('close');


                        closenotification("messagenotification");


                        $('#messagenotification').jqxNotification({ autoClose: false, width: "auto", height: 50, template: 'error', appendContainer: "#Drawsearchpagenotificationcontainer" });

                        if (error.status == 500) {

                            $("#messagenotification").find("div").first().text("Server is busy. Please try again in a few moments.");

                        } else {

                            $("#messagenotification").find("div").first().text("Error calling Name2Structure. Status : " + error.status);
                        }



                        $("#messagenotification").jqxNotification("open");
                    }
                });



            } else {

                $("#n2sinput").jqxTooltip({ autoHideDelay: 2000, content: "Please enter name", position: 'top', autoHide: true, trigger: "none", closeOnClick: true });
                $("#n2sinput").jqxTooltip("open");

                return;

            }


        }


        function doSearch(jdata) {



            $('#jqxLoader').jqxLoader('open');

            $.ajax({
                type: "POST",




                url: "https://akoscompounds.de/webinquiriesapibingodev/api/akoswebrequestsapi/ExecutecompletefullstructuresearchNewest",
                cache: false,

                data: JSON.stringify(jdata),

                success: function (response) {



                    $('#jqxLoader').jqxLoader('close');


                    if (response.errorflag) {


                        closenotification("messagenotification");


                        $('#messagenotification').jqxNotification({ autoClose: false, width: "auto", height: 50, template: 'error', appendContainer: "#Drawsearchpagenotificationcontainer" });
                        $("#messagenotification").find("div").first().text("Error calling Executecompletefullstructuresearch. Message : " + response.errortext);
                        $("#messagenotification").jqxNotification("open");


                    } else {






                        var data = response.initialsearchresults;

                        if (data.length == 0) {


                            
                            sessionStorage.setItem("openquickrequest", "YES");
                            window.location.href = "https://akoscompounds.de/webinquiryappbingo/index.html";



                        } else {

                            sessionStorage.setItem("structurequery", JSON.stringify(jdata));

                            var exportdata = JSON.stringify(data);

                            sessionStorage.setItem("griddata", exportdata);



                            var chemspaceapidata = response.chemspaceapihits;

                            var exportchemspaceapidata = JSON.stringify(chemspaceapidata);

                            sessionStorage.setItem("chemspacedata", exportchemspaceapidata);















                            sessionStorage.setItem("enablesimilaritybutton", true);

                            sessionStorage.setItem("searchexecuted", "YES");

                            window.location.href = "https://akoscompounds.de/webinquiryappbingo/results.html";


                        }

                        



                        









                    }

                },
                error: function (error) {

                    $('#jqxLoader').jqxLoader('close');

                    closenotification("messagenotification");


                    $('#messagenotification').jqxNotification({ autoClose: false, width: "auto", height: 50, template: 'error', appendContainer: "#Drawsearchpagenotificationcontainer" });

                    if (error.status == 500) {

                        $("#messagenotification").find("div").first().text("Server is busy. Please try again in a few moments.");

                    } else {

                        $("#messagenotification").find("div").first().text("Error calling Executecompletefullstructuresearch. Status : " + error.status);
                    }






                    $("#messagenotification").jqxNotification("open");


                }
            });


        }






        $(document).ready(function () {



            document.getElementById("messagenotification").style.display = 'block';

            document.getElementById("quickrequestpromptwindow").style.display = 'block';

            document.getElementById("assistedrequesthelpwindow").style.display = 'block';

            var btn_navigation_search = $("#btn_navigation_search");

            });

            var btn_navigation_drawstructure = $("#btn_navigation_drawstructure");

            btn_navigation_drawstructure.jqxButton({ width: 120, height: 50 });


            $("#btn_navigation_drawstructure").css("text-decoration", "underline");

            $("#btn_navigation_drawstructure").css("text-decoration-thickness", "2px");

            btn_navigation_drawstructure.click(function (event) {

                window.location.href = "https://akoscompounds.de/webinquiryappbingo/draw-search.html";
            });

            var btn_navigation_results = $("#btn_navigation_results");

            btn_navigation_results.jqxButton({ width: 120, height: 50 });

            btn_navigation_results.click(function (event) {

                window.location.href = "https://akoscompounds.de/webinquiryappbingo/results.html";
            });


            var btn_navigation_contact = $("#btn_navigation_contact");



            btn_navigation_contact.jqxButton({ width: 120, height: 50 });

            btn_navigation_contact.click(function (event) {

                window.location.href = "https://akoscompounds.de/webinquiryappbingo/contact.html";
            });


            var btn_navigation_about = $("#btn_navigation_about");



            btn_navigation_about.jqxButton({ width: 120, height: 50 });

            btn_navigation_about.click(function (event) {

                window.location.href = "https://akoscompounds.de/webinquiryappbingo/about.html";
            });




            var btn_navigation_requests = $("#btn_navigation_requests");

            

            btn_navigation_requests.jqxButton({ width: 100, height: 50, imgPosition: "left", textPosition: "left", imgSrc: "images/shopping_cart.png", textImageRelation: "imageBeforeText" });



            if (sessionStorage.getItem("shoppingitems") === null) {



                

                $('#btn_navigation_requests').jqxButton({ value: "Cart (0)" });


            } else {

                var data = sessionStorage.getItem("shoppingitems")

                var rows = JSON.parse(data);



                
                $('#btn_navigation_requests').jqxButton({ value: "Cart (" + rows.length + ")" });




            }



            $("#btn_navigation_requests").on('click', function () {

                window.location.href = "https://akoscompounds.de/webinquiryappbingo/requests.html";
            });







            var startsearchbutton = $("#btn_startsearch");


            startsearchbutton.jqxButton({ width: 80, height: 50, template: 'default' });

            startsearchbutton.click(function (event) {







                var ketcherFrame = document.getElementById('ketcher');




                var ketcher = null;

                ketcher = ketcherFrame.contentWindow.ketcher;

                var smiles = ketcher.getSmiles();

                var molfile = ketcher.getMolfile();






                const Emptystructurecheck = async () => {
                    const currentstructureassmiles = await smiles;
                    if (!isNotEmpty(currentstructureassmiles)) {

                        $("#ketcher").jqxTooltip({ autoHideDelay: 2000, content: 'Structure cannot be empty', position: 'bottom', autoHide: true, trigger: "none", closeOnClick: true });
                        $("#ketcher").jqxTooltip("open");

                    } else {



                        const currentstructuremolfile = await molfile;




                        var jData = {};
                        jData.registryid = "";
                        jData.smiles = currentstructureassmiles;
                        jData.molfile = currentstructuremolfile;

                        doSearch(jData);


                    }

                };

                Emptystructurecheck();










            })








           
            $("#n2sinput").jqxInput({ placeHolder: "AKOS number,CAS number,Molname,Synonym, Smiles", height: 50, width: 400, theme: "" });

            $("#n2sinput").on('keyup', function (e) {
                if (e.key === 'Enter' || e.keyCode === 13) {


                    doName2Structurelookup("n2sinput draw-search keyup");












                }
            });


            var n2ssearchbutton = $("#btn_n2sinput");

            n2ssearchbutton.jqxButton({ width: 130, height: 50, template: 'default' });
            n2ssearchbutton.click(function (event) {


                doName2Structurelookup("btn_n2sinput draw-search");













            });


























            var ketcher;

            




            $("#jqxLoader").jqxLoader({ width: 100, height: 60, imagePosition: 'top', isModal: true, text: "Processing..." });


           


            


            $("#quickrequestpromptwindow").jqxWindow({
                resizable: false,
                
                width: "50%",
                height: "20%",


                autoOpen: false,
                showCollapseButton: false,

                showCloseButton: false,

                okButton: $('#quickrequestpromptwindow_yes'), cancelButton: $('#quickrequestpromptwindow_no'),
                
                initContent: function () {



                    






                }

            });

            $('#quickrequestpromptwindow_help').jqxButton({ template: 'info' });

            $("#quickrequestpromptwindow_help").on('click', function () {


                $("#assistedrequesthelpwindow").jqxWindow({ width: "50%", height: "50%" });

                $("#assistedrequesthelpwindow").jqxWindow('open');

                $("#assistedrequesthelpwindow").jqxWindow("move", $(window).width() / 2 - $("#assistedrequesthelpwindow").jqxWindow("width") / 2, $(window).height() / 2 - $("#assistedrequesthelpwindow").jqxWindow("height") / 2);

                $('#assistedrequesthelpwindow').jqxWindow('bringToFront');

            });

            $('#quickrequestpromptwindow_yes').jqxButton({ template: 'primary' });

            $('#quickrequestpromptwindow_no').jqxButton({ template: 'primary' });

            $("#quickrequestpromptwindow").jqxWindow({ title: '' });

            $("#quickrequestpromptwindow_yes").on('click', function () {


                

                sessionStorage.setItem("openquickrequest", "YES");
                window.location.href = "https://akoscompounds.de/webinquiryappbingo/index.html";

            });


            

            $("#assistedrequesthelpwindow").jqxWindow({
                resizable: false,


                width: "50%",
                height: "50%",


                autoOpen: false,
                showCollapseButton: false,

                showCloseButton: true,



                initContent: function () {









                }

            });

            $("#assistedrequesthelpwindow").jqxWindow('setContent', '<iframe scrolling="no" style="display:block;border:none; height:100vh; width:100%;" src="assistedrequesthelpwindow_helptext.html"></iframe >');





        });
