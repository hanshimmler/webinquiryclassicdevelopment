    <script>


        function isNotEmpty(value) {



            if (typeof value !== 'undefined') {



                if (value !== null) {


                    if (value) {



                        return true;


                    } else {




                        return false;


                    }



                } else {


                    return false;


                }






            } else {
                return false;
            }



        }






        function doName2Structurelookup(origin) {



            var n2sinput = $('#n2sinput').jqxInput('val');

            if (isNotEmpty(n2sinput)) {


                jdata = {};

                jdata.name = n2sinput;

                jdata.origin = origin;

                $('#jqxLoader').jqxLoader('open');
                $.ajax({
                    type: "POST",

                    url: "http://akoscompounds.de/webinquiriesapibingodev/api/akoswebrequestsapi/Name2Structure",
                    cache: false,
                    data: JSON.stringify(jdata),
                    success: function (response) {
                        $('#jqxLoader').jqxLoader('close');

                        if (response.errorflag) {
                            $('#messagenotification').jqxNotification({ template: 'error' });
                            $("#messagenotification").find("div").first().text("Error calling Name2Structure. Message : " + response.errortext);
                            $("#messagenotification").jqxNotification("open");
                        } else {

                            if (response.noCIDMatch) {

                                $('#messagenotification').jqxNotification({ template: 'error' });
                                /*$("#messagenotification").find("div").first().text("Name cannot be resolved. You can try to draw your structure manually.");*/


                                $("#messagenotification").find("div").first().text("Name cannot be resolved. You can try to draw your structure manually or send us a quick request.");

                                $("#messagenotification").jqxNotification("open");

                                // add code here

                                $('#quickrequestpromptwindow').jqxWindow('open');

                                $("#quickrequestpromptwindow").jqxWindow("move", $(window).width() / 2 - $("#quickrequestpromptwindow").jqxWindow("width") / 2, $(window).height() / 2 - $("#popupwindowquickrequestform").jqxWindow("height") / 2);


                            } else {


                                var ketcherFrame = document.getElementById('ketcher');

                                var ketcher = ketcherFrame.contentWindow.ketcher;

                                ketcher.setMolecule(response.bestchoiceCIDMolfile);





                            }


                        }
                    },
                    error: function (error) {
                        $('#jqxLoader').jqxLoader('close');
                        $('#messagenotification').jqxNotification({ template: 'error' });

                        if (error.status == 500) {

                            $("#messagenotification").find("div").first().text("Server is busy. Please try again in a few moments.");

                        } else {

                            $("#messagenotification").find("div").first().text("Error calling Name2Structure. Status : " + error.status);
                        }



                        $("#messagenotification").jqxNotification("open");
                    }
                });



            } else {

                $("#n2sinput").jqxTooltip({ autoHideDelay: 2000, content: "Please enter name", position: 'top', autoHide: true, trigger: "none", closeOnClick: true });
                $("#n2sinput").jqxTooltip("open");

                return;

            }


        }


        function doSearch(jdata) {



            $('#jqxLoader').jqxLoader('open');

            $.ajax({
                type: "POST",




                url: "http://akoscompounds.de/webinquiriesapibingodev/api/akoswebrequestsapi/Executecompletefullstructuresearch",
                cache: false,

                data: JSON.stringify(jdata),

                success: function (response) {



                    $('#jqxLoader').jqxLoader('close');


                    if (response.errorflag) {

                        $('#messagenotification').jqxNotification({ template: 'error' });
                        $("#messagenotification").find("div").first().text("Error calling Executecompletefullstructuresearch. Message : " + response.errortext);
                        $("#messagenotification").jqxNotification("open");


                    } else {






                        var data = response.initialsearchresults;

                        sessionStorage.setItem("structurequery", JSON.stringify(jdata));

                        var exportdata = JSON.stringify(data);

                        sessionStorage.setItem("griddata", exportdata);

                        sessionStorage.setItem("enablesimilaritybutton", true);

                        sessionStorage.setItem("searchexecuted", "YES");

                        window.location.href = "results.html";



                        // add code here









                    }

                },
                error: function (error) {

                    $('#jqxLoader').jqxLoader('close');
                    $('#messagenotification').jqxNotification({ template: 'error' });

                    if (error.status == 500) {

                        $("#messagenotification").find("div").first().text("Server is busy. Please try again in a few moments.");

                    } else {

                        $("#messagenotification").find("div").first().text("Error calling Executecompletefullstructuresearch. Status : " + error.status);
                    }






                    $("#messagenotification").jqxNotification("open");


                }
            });


        }
